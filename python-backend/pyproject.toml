[project]
name = "python-backend"
version = "0.1.0"
description = "Minimal FastAPI backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
